<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新的回复</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;color:#374151;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px;line-height:1.8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr><td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;text-align:left;table-layout:fixed;">
            <tr><td style="padding:0 0 20px;border-bottom:1px solid #e5e7eb;color:#6b7280;font-size:13px;">陆屿的个人博客</td></tr>
            <tr><td style="padding:24px 0;overflow-wrap:anywhere;word-break:break-word;">
                <h1 style="margin:0 0 24px;color:#1f2937;font-size:22px;line-height:1.4;font-weight:600;">新的回复</h1>
                <p th:text="${type == 1 ? '文章评论收到了新的回复。' : '留言评论收到了新的回复。'}"></p><p th:if="${type == 1}" style="margin:0 0 8px;">文章：<span th:text="${title}"></span></p><p style="margin:0 0 16px;"><a th:href="${url}" style="color:#2563eb;text-decoration:underline;">查看原文</a></p><p style="margin:0 0 16px;">原评论</p><p style="margin:0 0 16px;"><strong><span th:text="${replyNickname}"></span></strong><br><span style="color:#6b7280;font-size:12px;"><span th:text="${replyTime}"></span></span></p><div style="padding:16px;margin:0 0 20px;background-color:#f8fafc;border-left:2px solid #dbeafe;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;" th:text="${replyContent}"></div><p style="margin:0 0 16px;">回复 @<span th:text="${replyNickname}"></span></p><p style="margin:0 0 16px;"><strong><span th:text="${nickname}"></span></strong><br><span style="color:#6b7280;font-size:12px;"><span th:text="${time}"></span></span></p><div style="padding:16px;margin:0 0 20px;background-color:#f8fafc;border-left:2px solid #dbeafe;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;" th:text="${content}"></div><p style="margin:0 0 16px;"><a th:href="${toUrl}" style="color:#2563eb;text-decoration:underline;">查看回复</a></p>
            </td></tr>
            <tr><td style="padding:20px 0 0;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px;">此邮件由陆屿的个人博客自动发送。</td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
