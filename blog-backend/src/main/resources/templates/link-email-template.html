<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新的友链申请</title>
</head>
<body style="margin:0;padding:0;background-color:#ffffff;color:#374151;font-family:Arial,'Microsoft YaHei',sans-serif;font-size:15px;line-height:1.8;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
    <tr><td align="center" style="padding:24px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px;text-align:left;table-layout:fixed;">
            <tr><td style="padding:0 0 20px;border-bottom:1px solid #e5e7eb;color:#6b7280;font-size:13px;">陆屿的个人博客</td></tr>
            <tr><td style="padding:24px 0;overflow-wrap:anywhere;word-break:break-word;">
                <h1 style="margin:0 0 24px;color:#1f2937;font-size:22px;line-height:1.4;font-weight:600;">新的友链申请</h1>
                <p style="margin:0 0 16px;">你收到了一份友情链接申请。</p><p style="margin:0 0 16px;">网站名称：<span th:text="${name}"></span></p><p style="margin:0 0 16px;">网站地址：<a th:href="${url}" th:text="${url}" style="color:#2563eb;word-break:break-all;"></a></p><p style="margin:0 0 16px;">网站介绍：<span th:text="${description}"></span></p><p style="margin:0 0 16px;">联系邮箱：<span th:text="${linkEmail}"></span></p><p><img th:src="${background}" alt="申请网站图片" width="240" style="display:block;max-width:100%;height:auto;border:0;"></p><p style="margin:0 0 16px;"><a th:href="${verifyCode}" style="color:#2563eb;text-decoration:underline;">审核友链申请</a></p><p style="margin:0 0 16px;"><a th:href="${toUrl}" style="color:#2563eb;text-decoration:underline;">访问网站</a></p>
            </td></tr>
            <tr><td style="padding:20px 0 0;border-top:1px solid #e5e7eb;color:#6b7280;font-size:12px;">此邮件由陆屿的个人博客自动发送。</td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
