# zhengluyu-blog production site. Managed by scripts/deploy-to-server.ps1.
server {
    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name zhengluyu.com;
    return 301 http://www.zhengluyu.com$request_uri;
}

server {
    server_tokens off;
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.zhengluyu.com 82.156.90.186 _;

    client_max_body_size 100M;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    location = /api/v3/api-docs { return 404; }
    location ^~ /api/v3/api-docs/ { return 404; }
    location ^~ /api/swagger-ui { return 404; }
    location ^~ /api/doc.html { return 404; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    location = /_app.config.js {
        alias /home/wwwroot/zhengluyu-website/admin/_app.config.js;
        add_header Cache-Control "no-cache" always;
    }

    location = /admin {
        return 302 /admin/;
    }

    location ^~ /admin/ {
        root /home/wwwroot/zhengluyu-website;
        try_files $uri $uri/ /admin/index.html;
    }

    location = /index.html {
        root /home/wwwroot/zhengluyu-website/blog;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* ^/(?:js|css|png|jpg|jpeg|gif|webp|avif|svg|woff|woff2|ttf)/.+\.(?:js|css|png|jpg|jpeg|gif|webp|avif|svg|woff|woff2|ttf)$ {
        root /home/wwwroot/zhengluyu-website/blog;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # 已打开的旧页面可能仍请求上一版哈希分包，部署后继续提供一版兼容窗口。
        try_files $uri @previous_blog_asset;
    }

    location @previous_blog_asset {
        root /home/wwwroot/zhengluyu-website/blog.previous;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /home/wwwroot/zhengluyu-website/blog;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
