<html lang="en">
<head>

    <title>陆屿的个人博客，欢迎来到我的小世界</title>
    <style>
        html,body,#app{width:100%;height:100%;margin:0}body{background:#14213e;color:#fff}
        .boot-hero{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 68% 24%,rgba(239,125,119,.32),transparent 34%),linear-gradient(145deg,#14213e 0%,#382d54 48%,#a6535f 100%);font-family:Georgia,"Songti SC","STSong",serif;text-align:center}

        .boot-hero__content{position:relative;z-index:1;padding:1.5rem}.boot-hero small{font:700 .65rem/1.5 system-ui,sans-serif;letter-spacing:.35em;opacity:.72}.boot-hero h1{max-width:12em;margin:.55em auto .25em;font-size:clamp(3rem,8vw,8rem);font-weight:400;line-height:.92;letter-spacing:-.055em;text-shadow:0 12px 40px rgba(7,12,26,.45)}.boot-hero p{margin:0;font:600 .72rem/1.5 system-ui,sans-serif;letter-spacing:.28em;opacity:.72}

    <link rel="preconnect" href="https://at.alicdn.com" crossorigin>
    <link rel="preload" href="https://at.alicdn.com/t/c/font_4468698_ja5z7qsallk.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
