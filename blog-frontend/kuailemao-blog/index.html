<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/blog-icon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>陆屿的个人博客，欢迎来到我的小世界</title>
    <style>
        html,body,#app{width:100%;min-height:100%;margin:0}body{background:#f5f8fc;color:#10243e}
        .boot-header{height:64px;border-bottom:1px solid #dce4ed;background:#fafcff}
        .boot-hero{box-sizing:border-box;width:min(calc(100% - 4rem),76rem);margin:auto;padding:3rem 0 2rem;display:grid;grid-template-columns:1.15fr 1fr;gap:3rem;align-items:center;font-family:system-ui,"PingFang SC",sans-serif}
        .boot-hero h1{font-size:clamp(2rem,3.5vw,3.25rem);font-weight:650;line-height:1.3;margin:0 0 1rem}.boot-hero p{font-size:1rem;color:#52657a;line-height:1.8}.boot-line{height:1rem;background:#eaf0f8;border-radius:4px;width:65%;margin-top:1rem}.boot-image{aspect-ratio:16/9;background:#eaf0f8;border-radius:14px}.boot-content{height:12rem;width:min(calc(100% - 4rem),76rem);border-top:1px solid #dce4ed;margin:auto}
        @media(max-width:767px){.boot-hero{width:calc(100% - 2rem);grid-template-columns:1fr;padding-top:2rem;gap:1.75rem}.boot-hero h1{font-size:2rem}.boot-content{width:calc(100% - 2rem)}}
    </style>
    <link rel="preconnect" href="https://at.alicdn.com" crossorigin>
    <link rel="preload" href="https://at.alicdn.com/t/c/font_4468698_ja5z7qsallk.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://at.alicdn.com/t/c/font_4468698_ja5z7qsallk.css"></noscript>
</head>
<body>
<div id="app"><div class="boot-header" aria-hidden="true"></div><main class="boot-hero" aria-label="首页加载中" aria-busy="true"><div><h1>欢迎来到陆屿的小世界</h1><p>正在加载首页内容</p><div class="boot-line" aria-hidden="true"></div></div><div class="boot-image" aria-hidden="true"></div></main><div class="boot-content" aria-hidden="true"></div></div>
<noscript><p>请启用 JavaScript 以浏览文章、工作经历和其他页面。</p></noscript>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
